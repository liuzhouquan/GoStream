services:
  minio:
    build:
      context: .
      dockerfile: deploy/minio.Dockerfile
    image: gostream-minio:source-7aac2a2c5b7c
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gostreamminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gostream-local-minio-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    environment:
      MEDIA_STORE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-gostreamminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gostream-local-minio-secret}
      MINIO_BUCKET: gostream-media
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
