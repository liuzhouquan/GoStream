<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101116" />
  <title>GoStream · 短视频社区</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="feed" data-layout="theater">
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol><symbol id="i-following" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="15" rx="3"/><path d="M7 3h10m-7 8 5 3-5 3Z"/></symbol><symbol id="i-hot" viewBox="0 0 24 24"><path d="M13 3c2 6-3 6-1 10 2-1 3-3 3-5 6 5 5 13-3 13C3 21 2 12 8 7c0 3 1 5 2 6-1-4 3-5 3-10Z"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM9 21h6"/></symbol><symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 1-9 9H8l-5 2 1-6a9 9 0 1 1 17-5Z"/><path d="M8 10h8m-8 4h5"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol><symbol id="i-stage" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4Z"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol><symbol id="i-mute" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm5 5 6 6m0-6-6 6"/></symbol><symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol></svg>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#feed"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></span><span>GoStream</span></a>
      <div class="side-label">探索</div>
      <nav class="nav-list">
        <button data-view="feed" class="nav-item active"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>为你推荐</button>
        <button data-view="following" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#i-following"/></svg>关注动态</button>
        <button data-view="hot" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#i-hot"/></svg>热门视频</button>
        <button data-view="search" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>发现创作者</button>
      </nav>
      <div class="side-label secondary-label">你的空间</div>
      <nav class="nav-list">
        <button data-view="upload" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>发布作品</button>
        <button data-view="notifications" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>通知中心</button>
        <button data-view="chat" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg>即时消息</button>
        <button data-view="profile" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>个人主页</button>
      </nav>
      <div class="sidebar-bottom"><span class="online-dot"></span><span id="session-state">游客浏览中</span><button id="auth-open" class="text-button">登录 / 注册</button></div>
    </aside>
    <main class="main-column">
      <header class="topbar">
        <div><div class="eyebrow">让每一份热爱被看见</div><h1 id="page-title">发现灵感</h1></div>
        <div class="top-actions"><label class="searchbox"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="global-search" aria-label="搜索视频或创作者" placeholder="搜索你感兴趣的内容" /><kbd>↵</kbd></label><button id="top-upload" class="publish-button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>发布作品</span></button><button id="top-notifications" class="round-button" aria-label="通知中心"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg></button><button id="top-avatar" aria-label="个人主页或登录" class="avatar-button">G</button></div>
      </header>
      <div class="scene-tabs"><button class="scene active" data-scene="recommend">精选</button><button class="scene" data-scene="timeline">最新</button><button class="scene" data-scene="following">关注</button><button class="scene" data-scene="hot">热榜</button><span class="tab-rule"></span><span class="feed-hint">发现你喜欢的每一种生活</span><div class="layout-switch" role="group" aria-label="浏览布局"><button data-layout-choice="theater" class="active" aria-label="沉浸浏览" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-stage"/></svg></button><button data-layout-choice="grid" aria-label="网格浏览" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg></button></div></div>
      <section id="content" class="content-grid" aria-label="页面内容" aria-busy="true"></section><div id="feed-navigation" class="feed-navigation" aria-label="视频切换"><button class="round-button" data-video-step="-1" aria-label="上一个视频"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg></button><span id="feed-position" aria-live="polite">01</span><button class="round-button" data-video-step="1" aria-label="下一个视频"><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></button><span class="navigation-hint">↑ ↓ 切换</span><button id="sound-toggle" class="round-button" aria-label="开启声音" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-mute"/></svg></button></div>
      <div id="toast" class="toast" role="status"></div>
    </main>
  </div>
  <dialog id="auth-dialog" class="dialog" aria-labelledby="auth-title"><form method="dialog" class="dialog-close"><button type="button" aria-label="关闭">×</button></form><div class="dialog-kicker">WELCOME TO GOSTREAM</div><h2 id="auth-title">加入创作者社区</h2><p>登录后关注创作者、发布视频并参与讨论。</p><form id="auth-form"><label>用户名<input name="username" minlength="3" required autocomplete="username" /></label><label id="nickname-wrap" hidden>昵称<input name="nickname" maxlength="48" /></label><label>密码<input name="password" type="password" minlength="8" required autocomplete="current-password" /></label><button class="primary-button" type="submit" id="auth-submit">登录</button></form><button class="text-button switch-auth" id="auth-switch">还没有账号？立即注册</button></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
