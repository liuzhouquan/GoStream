<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0b0e" />
  <title>GoStream · 短视频社区</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#feed"><span class="brand-mark">G</span><span>GoStream</span></a>
      <div class="side-label">探索</div>
      <nav class="nav-list">
        <button data-view="feed" class="nav-item active"><span>◉</span>为你推荐</button>
        <button data-view="following" class="nav-item"><span>◎</span>关注动态</button>
        <button data-view="hot" class="nav-item"><span>↗</span>热门视频</button>
        <button data-view="search" class="nav-item"><span>⌕</span>发现创作者</button>
      </nav>
      <div class="side-label secondary-label">你的空间</div>
      <nav class="nav-list">
        <button data-view="upload" class="nav-item"><span>＋</span>发布作品</button>
        <button data-view="notifications" class="nav-item"><span>♧</span>通知中心</button>
        <button data-view="chat" class="nav-item"><span>◌</span>即时消息</button>
        <button data-view="profile" class="nav-item"><span>◉</span>个人主页</button>
      </nav>
      <div class="sidebar-bottom"><span class="online-dot"></span><span id="session-state">游客浏览中</span><button id="auth-open" class="text-button">登录 / 注册</button></div>
    </aside>
    <main class="main-column">
      <header class="topbar">
        <div><div class="eyebrow">VIDEO COMMUNITY</div><h1 id="page-title">发现灵感</h1></div>
        <div class="top-actions"><label class="searchbox"><span>⌕</span><input id="global-search" placeholder="搜索视频或创作者" /><kbd>↵</kbd></label><button id="top-avatar" class="avatar-button">G</button></div>
      </header>
      <div class="scene-tabs"><button class="scene active" data-scene="recommend">精选</button><button class="scene" data-scene="timeline">最新</button><button class="scene" data-scene="following">关注</button><button class="scene" data-scene="hot">热榜</button><span class="tab-rule"></span><span class="feed-hint">每一次滑动，都是新的发现 <b>✳</b></span></div>
      <section id="content" class="content-grid"></section>
      <div id="toast" class="toast"></div>
    </main>
  </div>
  <dialog id="auth-dialog" class="dialog"><form method="dialog" class="dialog-close"><button type="button" aria-label="关闭">×</button></form><div class="dialog-kicker">WELCOME TO GOSTREAM</div><h2 id="auth-title">加入创作者社区</h2><p>登录后关注创作者、发布视频并参与讨论。</p><form id="auth-form"><label>用户名<input name="username" minlength="3" required autocomplete="username" /></label><label id="nickname-wrap" hidden>昵称<input name="nickname" maxlength="48" /></label><label>密码<input name="password" type="password" minlength="8" required autocomplete="current-password" /></label><button class="primary-button" type="submit" id="auth-submit">登录</button></form><button class="text-button switch-auth" id="auth-switch">还没有账号？立即注册</button></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
