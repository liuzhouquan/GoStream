services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gostream
      MYSQL_USER: gostream
      MYSQL_PASSWORD: gostream-local
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ugostream -pgostream-local --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.9
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      ADDR: :8080
      DB_DRIVER: mysql
      DB_DSN: gostream:gostream-local@tcp(mysql:3306)/gostream?charset=utf8mb4&parseTime=True&loc=Local
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique random value in .env or the shell}
      MEDIA_DIR: /app/data/media
      REDIS_ADDR: redis:6379
      FFMPEG_BIN: /usr/bin/ffmpeg
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - media_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    build:
      context: .
      dockerfile: deploy/prometheus.Dockerfile
    image: gostream-prometheus:local
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    build:
      context: .
      dockerfile: deploy/grafana.Dockerfile
    image: gostream-grafana:local
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-gostream-local-only}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql_data:
  redis_data:
  media_data:
  prometheus_data:
  grafana_data:
