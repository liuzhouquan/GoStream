name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Confirm the exact Go version
        shell: bash
        run: |
          required="$(awk '$1 == "go" { print "go" $2; exit }' go.mod)"
          actual="$(go env GOVERSION)"
          echo "required=$required actual=$actual"
          test "$actual" = "$required"

      - name: Go tests
        run: go test ./...

      - name: Go race tests
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Build executables
        run: go build ./cmd/gostream ./cmd/gostream-media ./cmd/gostream-events

      - name: Check web client syntax
        run: node --check web/app.js

      - name: Validate Compose configuration
        env:
          JWT_SECRET: ci-compose-configuration-only-secret-123456789
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.object.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.object.yml -f tests/integration/object-test.compose.yml config --quiet
          python3 - <<'PY'
          import json, subprocess
          command = ['docker', 'compose', '-f', 'docker-compose.yml', '-f', 'docker-compose.object.yml', '-f', 'tests/integration/object-test.compose.yml', 'config', '--format', 'json']
          config = json.loads(subprocess.check_output(command, text=True))
          assert not config['services']['rabbitmq'].get('ports'), 'isolated broker must not bind demo host ports'
          PY

  rabbitmq-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-rabbitmq-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=root-rabbitmq-ci-only mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Exercise broker confirms, redelivery, DLQ replay, restart and API workers
        run: >-
          python3 tests/integration/rabbitmq_smoke.py
          --go-bin go
          --mysql-container "${{ job.services.mysql.id }}"
          --mysql-addr 127.0.0.1:3306

  im-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-im-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=root-im-ci-only mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Exercise real API process kills, Redis outage, device ACKs and replay
        run: >-
          python3 tests/integration/im_smoke.py
          --go-bin go
          --mysql-container "${{ job.services.mysql.id }}"
          --mysql-addr 127.0.0.1:3306

      - name: Verify cleanup when the Go test times out after API startup
        run: >-
          python3 tests/integration/im_smoke.py
          --go-bin go
          --mysql-container "${{ job.services.mysql.id }}"
          --mysql-addr 127.0.0.1:3306
          --check-timeout-cleanup

  redis-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.2.9
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      GOSTREAM_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test shared Redis request budget
        run: go test ./internal/platform -run '^TestRateLimiterRealRedisIntegration$' -count=1 -v

  video-recovery-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Ensure FFmpeg and ffprobe are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: Build API and test processor-disabled restart recovery
        run: |
          go build -o "$RUNNER_TEMP/gostream" ./cmd/gostream
          python3 tests/integration/video_recovery_restart.py \
            --binary "$RUNNER_TEMP/gostream" --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"

  mysql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: gostream_ci
          MYSQL_USER: gostream
          MYSQL_PASSWORD: gostream-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ugostream -pgostream-ci-only --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      GOSTREAM_TEST_MYSQL_DSN: gostream:gostream-ci-only@tcp(127.0.0.1:3306)/gostream_ci?charset=utf8mb4&parseTime=True&loc=Local
      GOSTREAM_TEST_MYSQL_LEGACY_DSN: gostream:gostream-ci-only@tcp(127.0.0.1:3306)/gostream_ci_legacy?charset=utf8mb4&parseTime=True&loc=Local
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Migrate a fresh MySQL database with concurrent starters
        run: go test ./internal/migrations -run '^TestApplyMySQLIntegration$' -count=1

      - name: Create an isolated prior-schema database
        run: |
          docker exec -i "${{ job.services.mysql.id }}" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot' <<'SQL'
          CREATE DATABASE gostream_ci_legacy;
          GRANT ALL PRIVILEGES ON gostream_ci_legacy.* TO 'gostream'@'%';
          SQL

      - name: Test prior-schema adoption and interrupted migration recovery
        run: go test ./internal/migrations -run '^TestApplyMySQLLegacyIntegration$' -count=1

      - name: Upgrade the prior MySQL version without losing outbox data
        run: go test ./internal/migrations -run '^TestMySQLV002UpgradeIntegration$' -count=1

      - name: Upgrade v004 to v005 without rewriting device receipts
        run: go test ./internal/migrations -run '^TestMySQLV005UpgradeIntegration$' -count=1

      - name: Compare frozen and previous MySQL schema metadata
        run: go test ./internal/migrations -run '^TestMySQLMigratedSchemaMatchesLegacyModels$' -count=1

      - name: Rehearse MySQL backup restore and v002 rollback
        env:
          GOSTREAM_RECOVERY_DSN_PREFIX: gostream:gostream-ci-only@tcp(127.0.0.1:3306)/
        run: bash tests/integration/mysql_recovery.sh "${{ job.services.mysql.id }}"

      - name: Run real MySQL integration tests
        run: go test ./internal/platform -run '^TestMySQL' -count=1

      - name: Verify group commit ordering under concurrent sends
        run: go test -race ./internal/platform -run '^TestMySQL(Group(CommitOrder|MemberRevocationRace)|DeviceAckRanges)$' -count=3

  minio-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-media-ci-only
          MYSQL_DATABASE: gostream_media_ci
          MYSQL_USER: gostream
          MYSQL_PASSWORD: gostream-media-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ugostream -pgostream-media-ci-only --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      GOSTREAM_TEST_MINIO_ENDPOINT: 127.0.0.1:19000
      GOSTREAM_TEST_MINIO_ACCESS_KEY: gostream-ci
      GOSTREAM_TEST_MINIO_SECRET_KEY: gostream-ci-test-only-secret
      JWT_SECRET: ci-compose-configuration-only-secret-123456789
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build pinned MinIO source and start an isolated server
        run: |
          docker compose -f docker-compose.yml -f docker-compose.object.yml build minio
          docker run -d --rm --name gostream-ci-minio -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER="$GOSTREAM_TEST_MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$GOSTREAM_TEST_MINIO_SECRET_KEY" \
            gostream-minio:source-7aac2a2c5b7c server /data --address :9000
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs gostream-ci-minio
          exit 1

      - name: Test real MinIO uploads and object cleanup across two API instances
        run: go test ./internal/platform -run '^TestMinIOMediaAcrossInstances$' -count=1 -v

      - name: Test media import and object backup restore on real MinIO
        run: go test ./internal/platform -run '^TestMinIOMediaTransfer$' -count=1 -v

      - name: Rehearse MySQL and MinIO media recovery together
        run: >-
          python3 tests/integration/media_transfer_smoke.py
          --go-bin go
          --minio-endpoint "$GOSTREAM_TEST_MINIO_ENDPOINT"
          --access-key "$GOSTREAM_TEST_MINIO_ACCESS_KEY"
          --secret-key "$GOSTREAM_TEST_MINIO_SECRET_KEY"
          --mysql-dsn 'gostream:gostream-media-ci-only@tcp(127.0.0.1:3306)/gostream_media_ci?charset=utf8mb4&parseTime=True&loc=Local'
          --mysql-container "${{ job.services.mysql.id }}"

      - name: Test MySQL and MinIO upload validation, permissions and chunk repair
        env:
          GOSTREAM_TEST_MINIO_MYSQL_DSN: gostream:gostream-media-ci-only@tcp(127.0.0.1:3306)/gostream_media_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: go test ./internal/platform -run '^TestMinIOMediaValidationAndRecovery$' -count=1 -v

      - name: Reject truncated images in direct and resumable MinIO uploads
        run: go test ./internal/platform -run '^TestMinIOImagePayloadValidation$' -count=1 -v

      - name: Test output PUT response loss and durable retry on MySQL and MinIO
        env:
          GOSTREAM_TEST_MINIO_MYSQL_DSN: gostream:gostream-media-ci-only@tcp(127.0.0.1:3306)/gostream_media_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: go test ./internal/platform -run '^TestMinIOProcessedOutputLostResponse$' -count=1 -v

      - name: Test completion leases and cleanup across MySQL and MinIO instances
        env:
          GOSTREAM_TEST_MYSQL_DSN: gostream:gostream-media-ci-only@tcp(127.0.0.1:3306)/gostream_upload_lease_ci?charset=utf8mb4&parseTime=True&loc=Local
          GOSTREAM_TEST_UPLOAD_LEASE_MYSQL_DSN: gostream:gostream-media-ci-only@tcp(127.0.0.1:3306)/gostream_upload_lease_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: |
          docker exec -i -e MYSQL_PWD=root-media-ci-only "${{ job.services.mysql.id }}" mysql -uroot <<'SQL'
          CREATE DATABASE gostream_upload_lease_ci;
          GRANT ALL PRIVILEGES ON gostream_upload_lease_ci.* TO 'gostream'@'%';
          SQL
          go test ./internal/migrations -run '^TestApplyMySQLIntegration$' -count=1
          go test -race ./internal/platform -run '^TestMinIOUploadCompletionCleanupLease$' -count=1 -v

      - name: Verify media header permissions and full HTTP storage outage recovery
        run: go test -race ./internal/platform -run '^TestMinIO(CompleteStorageOutage|MediaFormatAndPermissionMatrix)$' -count=1 -v

      - name: Stop isolated MinIO
        if: always()
        run: docker rm -f gostream-ci-minio || true

  browser-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install the declared Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned browser CLI runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install real FFmpeg and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install -g agent-browser@0.37.1
          agent-browser install --with-deps
      - name: Run browser regression and real SQLite FFmpeg workflow
        env:
          GOSTREAM_GO_BIN: go
        run: |
          python3 tests/integration/web_action_counts.py
          python3 tests/integration/web_stored_session.py
          python3 tests/integration/web_group_sync.py
          python3 tests/integration/web_full_flow.py
